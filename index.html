<style>

#universo{

    touch-action:none;

        opacity 1.5s ease;
}


#universo.activo{

    opacity:1;

    pointer-events:auto;
}


/* =====================================================
   GALAXIAS VERDES
===================================================== */

.galaxia{

    position:absolute;

    width:280px;

    height:110px;

    border-radius:50%;

    opacity:.35;

    filter:blur(1px);

    background:
    radial-gradient(
        ellipse,
        rgba(0,255,130,.75) 0%,
        rgba(0,180,90,.25) 30%,
        transparent 70%
    );

    pointer-events:none;
}


.g1{

    left:-80px;

    top:15%;
}


.g2{

    right:-100px;

    top:55%;

    transform:
        rotate(35deg);
}


.g3{

    left:25%;

    bottom:-50px;

    transform:
        rotate(-10deg);
}


/* =====================================================
   ESTRELLAS
===================================================== */

.estrella{

    position:absolute;

    width:3px;

    height:3px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 5px currentColor,
        0 0 10px currentColor;

    animation:
        parpadeo
        1.5s
        ease-in-out
        infinite
        alternate;

    transition:
        left .08s linear,
        top .08s linear;

    pointer-events:none;

    z-index:50;
}


@keyframes parpadeo{

    from{

        opacity:.25;

        transform:
            scale(.7);
    }

    to{

        opacity:1;

        transform:
            scale(1.4);
    }
}


/* =====================================================
   FOTOS
===================================================== */

.foto{

    position:absolute;

    width:72px;

    height:72px;

    object-fit:cover;

    border-radius:14px;

    opacity:.35;

    pointer-events:none;

    border:
        1px solid
        rgba(255,255,255,.18);

    box-shadow:

        0 0 8px
        rgba(255,255,255,.15),

        0 0 18px
        rgba(0,255,130,.18);

    animation:

        movimientoLibre

        var(--duracion)

        ease-in-out

        infinite

        alternate;

    animation-delay:
        var(--delay);

    z-index:100;
}


@keyframes movimientoLibre{

    0%{

        transform:
            translate(
                var(--movX1),
                var(--movY1)
            )
            rotate(-8deg);
    }

    25%{

        transform:
            translate(
                var(--movX2),
                var(--movY2)
            )
            rotate(6deg);
    }

    50%{

        transform:
            translate(
                var(--movX3),
                var(--movY3)
            )
            rotate(-5deg);
    }

    75%{

        transform:
            translate(
                var(--movX4),
                var(--movY4)
            )
            rotate(8deg);
    }

    100%{

        transform:
            translate(
                var(--movX5),
                var(--movY5)
            )
            rotate(-6deg);
    }

}


@media(max-width:600px){

        height:58px;

        border-radius:12px;
    }

}


/* =====================================================
   ESTRELLA FUGAZ

.estrellaFugaz{

        transform:

            rotate(-45deg);

    15%{

        transform:

    }

}

    position:absolute;

</style>

    <div class="galaxia g1"></div>

        💚 Presiona y mantén presionado 💚

    </div>

        <div id="corazonLatido"></div>

    </div>

        onclick="irALasCartas()">

<script>

/* =====================================================
   VARIABLES
===================================================== */

const CONTRASENA =
    "040723";


let password = "";


const bloqueo =
    document.getElementById(
        "bloqueo"
    );


const pantallaPassword =
    document.getElementById(
        "pantallaPassword"
    );


const errorPassword =
    document.getElementById(
        "errorPassword"
    );


const universo =
    document.getElementById(
        "universo"
    );


const mensaje =
    document.getElementById(
        "mensaje"
    );


const corazon3D =
    document.getElementById(
        "corazon3D"
    );


const teAmo =
    document.getElementById(
        "teAmo"
    );


const botonCartas =
    document.getElementById(
        "botonCartas"
    );


let estrellas = [];

let fotos = [];


let atrayendo = false;

let corazonFormado = false;


let dedoX = 50;

let dedoY = 50;


let pointerActivo = null;


let posicionesEstrellas = [];


/* =====================================================
   CONTRASEÑA
===================================================== */

document
.querySelectorAll(".botonNumero")
.forEach(boton => {

    boton.addEventListener(
        "click",
        () => {

            const valor =
                boton.dataset.num;


            if(
                valor === "borrar"
            ){

                password =
                    password.slice(
                        0,
                        -1
                    );

                actualizarPassword();

                return;
            }


            if(
                valor === "ok"
            ){

                comprobarPassword();

                return;
            }


            if(
                password.length >= 6
            ){

                return;
            }


            password += valor;


            actualizarPassword();


            if(
                password.length === 6
            ){

                comprobarPassword();
            }

        }
    );

});


function actualizarPassword(){

    pantallaPassword.textContent =
        "•".repeat(
            password.length
        );

}


function comprobarPassword(){

    if(
        password === CONTRASENA
    ){

        errorPassword.textContent =
            "";

        bloqueo.style.opacity =
            "0";


        setTimeout(() => {

            bloqueo.style.display =
                "none";


            universo.classList.add(
                "activo"
            );


            iniciarUniverso();

        },700);

    }

    else{

        errorPassword.textContent =
            "Contraseña incorrecta";


        password = "";


        actualizarPassword();

    }

}


/* =====================================================
   UNIVERSO
===================================================== */

function iniciarUniverso(){

    crearEstrellas();

    crearFotos();

    iniciarEstrellasFugaces();

    activarInteraccion();

}


/* =====================================================
   ESTRELLAS
===================================================== */

function crearEstrellas(){

    const cantidad =
        window.innerWidth < 600
        ? 240
        : 360;


    const colores = [

        "#ffffff",
        "#b8ffd9",
        "#8affc1",
        "#d4ffe6",
        "#66ffb0",
        "#caffdf"

    ];


    for(
        let i=0;
        i<cantidad;
        i++
    ){

        const estrella =
            document.createElement(
                "div"
            );


        estrella.className =
            "estrella";


        estrella.style.color =
            colores[
                Math.floor(
                    Math.random()
                    *
                    colores.length
                )
            ];


        const x =
            Math.random()
            *
            window.innerWidth;


        const y =
            Math.random()
            *
            window.innerHeight;


        estrella.style.left =
            x + "px";


        estrella.style.top =
            y + "px";


        estrella.style.animationDelay =
            Math.random()*2 + "s";


        universo.appendChild(
            estrella
        );


        estrellas.push(
            estrella
        );


        posicionesEstrellas.push({

            x:x,

            y:y

        });

    }

}


/* =====================================================
   FOTOS
===================================================== */

function crearFotos(){

    for(
        let i=1;
        i<=33;
        i++
    ){

        const foto =
            document.createElement(
                "img"
            );


        foto.className =
            "foto";


        foto.src =
            `fotos/foto${String(i).padStart(2,"0")}.jpg`;


        const ancho =
            window.innerWidth;


        const alto =
            window.innerHeight;


        const x =
            Math.random()
            *
            Math.max(
                20,
                ancho-90
            );


        const y =
            Math.random()
            *
            Math.max(
                20,
                alto-90
            );


        foto.style.left =
            x + "px";


        foto.style.top =
            y + "px";


        foto.style.setProperty(
            "--duracion",
            (
                8 +
                Math.random()*12
            )
            + "s"
        );


        foto.style.setProperty(
            "--delay",
            (
                -Math.random()*15
            )
            + "s"
        );


        /*
           Movimiento X
        */

        foto.style.setProperty(
            "--movX1",
            (
                -30 +
                Math.random()*60
            )
            + "px"
        );


        foto.style.setProperty(
            "--movX2",
            (
                -70 +
                Math.random()*140
            )
            + "px"
        );


        foto.style.setProperty(
            "--movX3",
            (
                -50 +
                Math.random()*100
            )
            + "px"
        );


        foto.style.setProperty(
            "--movX4",
            (
                -90 +
                Math.random()*180
            )
            + "px"
        );


        foto.style.setProperty(
            "--movX5",
            (
                -40 +
                Math.random()*80
            )
            + "px"
        );


        /*
           Movimiento Y
        */

        foto.style.setProperty(
            "--movY1",
            (
                -30 +
                Math.random()*60
            )
            + "px"
        );


        foto.style.setProperty(
            "--movY2",
            (
                -80 +
                Math.random()*160
            )
            + "px"
        );


        foto.style.setProperty(
            "--movY3",
            (
                -50 +
                Math.random()*100
            )
            + "px"
        );


        foto.style.setProperty(
            "--movY4",
            (
                -90 +
                Math.random()*180
            )
            + "px"
        );


        foto.style.setProperty(
            "--movY5",
            (
                -40 +
                Math.random()*80
            )
            + "px"
        );


        foto.style.opacity =
            .25 +
            Math.random()*.35;


        foto.onerror =
            function(){

                this.style.display =
                    "none";

            };


        universo.appendChild(
            foto
        );


        fotos.push(
            foto
        );

    }

}


/* =====================================================
   ESTRELLAS FUGACES
===================================================== */

function iniciarEstrellasFugaces(){

    setInterval(() => {

        if(
            !universo.classList.contains(
                "activo"
            )
        ){

            return;
        }


        const fugaz =
            document.createElement(
                "div"
            );


        fugaz.className =
            "estrellaFugaz";


        fugaz.style.left =
            (
                20 +
                Math.random()*80
            )
            + "%";


        fugaz.style.top =
            Math.random()*60
            + "%";


        universo.appendChild(
            fugaz
        );


        setTimeout(() => {

            fugaz.remove();

        },1300);


    },3200);

}


/* =====================================================
   INTERACCIÓN
===================================================== */

function activarInteraccion(){

    universo.addEventListener(
        "pointerdown",
        comenzarAtraccion,
        {
            passive:false
        }
    );


    universo.addEventListener(
        "pointermove",
        moverDedo,
        {
            passive:false
        }
    );


    universo.addEventListener(
        "pointerup",
        soltarPantalla,
        {
            passive:false
        }
    );


    universo.addEventListener(
        "pointercancel",
        cancelarInteraccion,
        {
            passive:false
        }
    );

}


/* =====================================================
   PRESIONAR
===================================================== */

function comenzarAtraccion(event){

    if(
        corazonFormado
    ){

        return;
    }


    if(
        pointerActivo !== null
    ){

        return;
    }


    event.preventDefault();


    pointerActivo =
        event.pointerId;


    atrayendo = true;


    try{

        universo.setPointerCapture(
            event.pointerId
        );

    }

    catch(e){}


    obtenerPosicionPointer(
        event
    );


    mensaje.style.opacity =
        "0";

}


/* =====================================================
   MOVER
===================================================== */

function moverDedo(event){

    if(
        !atrayendo
    ){

        return;
    }


    if(
        pointerActivo !==
        event.pointerId
    ){

        return;
    }


    event.preventDefault();


    obtenerPosicionPointer(
        event
    );

}


/* =====================================================
   POSICIÓN
===================================================== */

function obtenerPosicionPointer(event){

    dedoX =
        event.clientX;


    dedoY =
        event.clientY;


    moverEstrellasHaciaDedo();

}


/* =====================================================
   AGRUPAR ESTRELLAS
===================================================== */

function moverEstrellasHaciaDedo(){

    if(
        !atrayendo
    ){

        return;
    }


    posicionesEstrellas.forEach(
        (pos,i) => {

            const estrella =
                estrellas[i];


            const fuerza =
                .065;


            pos.x +=
                (
                    dedoX -
                    pos.x
                )
                *
                fuerza;


            pos.y +=
                (
                    dedoY -
                    pos.y
                )
                *
                fuerza;


            estrella.style.left =
                pos.x + "px";


            estrella.style.top =
                pos.y + "px";

        }
    );

}


/* =====================================================
   SOLTAR
===================================================== */

function soltarPantalla(event){

    if(
        !atrayendo
    ){

        return;
    }


    if(
        pointerActivo !==
        event.pointerId
    ){

        return;
    }


    event.preventDefault();


    atrayendo = false;


    pointerActivo = null;


    try{

        universo.releasePointerCapture(
            event.pointerId
        );

    }

    catch(e){}


    /*
       EL CORAZÓN APARECE
       SOLO AL SOLTAR.
    */

    formarCorazon();

}


/* =====================================================
   CANCELAR
===================================================== */

function cancelarInteraccion(event){

    if(
        pointerActivo !==
        event.pointerId
    ){

        return;
    }


    atrayendo = false;

    pointerActivo = null;


    try{

        universo.releasePointerCapture(
            event.pointerId
        );

    }

    catch(e){}

}


/* =====================================================
   FORMAR CORAZÓN
===================================================== */

function formarCorazon(){

    if(
        corazonFormado
    ){

        return;
    }


    corazonFormado = true;


    universo.classList.add(
        "corazonActivo"
    );


    mensaje.style.opacity =
        "0";


    estrellas.forEach(
        (estrella,i) => {

            const cantidad =
                estrellas.length;


            const t =
                Math.PI *
                2 *
                i /
                cantidad;


            const x =
                16 *
                Math.pow(
                    Math.sin(t),
                    3
                );


            const y =
                13 *
                Math.cos(t)
                -
                5 *
                Math.cos(2*t)
                -
                2 *
                Math.cos(3*t)
                -
                Math.cos(4*t);


            const escala =
                window.innerWidth < 600
                ? 2.05
                : 2.6;


            const centroX =
                window.innerWidth /
                2;


            const centroY =
                window.innerHeight /
                2;


            const destinoX =
                centroX +
                x *
                escala *
                (
                    window.innerWidth /
                    100
                );


            const destinoY =
                centroY -
                y *
                escala *
                (
                    window.innerWidth /
                    100
                );


            estrella.classList.add(
                "corazon"
            );


            estrella.style.left =
                destinoX + "px";


            estrella.style.top =
                destinoY + "px";


            estrella.style.zIndex =
                "4500";

        }
    );


    /*
       Primero aparece TE AMO.
    */

    setTimeout(() => {

        teAmo.classList.add(
            "mostrar"
        );

    },3300);


    /*
       Después aparece el botón.
    */

    setTimeout(() => {

        botonCartas.classList.add(
            "mostrar"
        );

    },4500);

}


/* =====================================================
   BOTÓN CARTAS
===================================================== */

function irALasCartas(){

    window.location.href =
        "cartas.html";

}


/* =====================================================
   MOVIMIENTO 3D
===================================================== */

document.addEventListener(
    "mousemove",
    event => {

        if(
            !corazonFormado
        ){

            return;
        }


        const centroX =
            window.innerWidth /
            2;


        const centroY =
            window.innerHeight /
            2;


        const rotY =
            (
                (
                    event.clientX -
                    centroX
                )
                /
                window.innerWidth
            )
            *
            20;


        const rotX =
            -(
                (
                    event.clientY -
                    centroY
                )
                /
                window.innerHeight
            )
            *
            20;


        corazon3D.style.transform =
            `
            translate(-50%,-50%)
            rotateX(${rotX}deg)
            rotateY(${rotY}deg)
            `;

    }
);


/* =====================================================
   MOVIMIENTO DEL CELULAR
===================================================== */

window.addEventListener(
    "deviceorientation",
    event => {

        if(
            !corazonFormado
        ){

            return;
        }


        if(
            event.gamma === null ||
            event.beta === null
        ){

            return;
        }


        const gamma =
            Math.max(
                -20,
                Math.min(
                    20,
                    event.gamma
                )
            );


        const beta =
            Math.max(
                -20,
                Math.min(
                    20,
                    event.beta
                )
            );


        corazon3D.style.transform =
            `
            translate(-50%,-50%)
            rotateX(${-beta}deg)
            rotateY(${gamma}deg)
            `;

    }
);


/* =====================================================
   PERMISO IPHONE
===================================================== */

document.addEventListener(
    "click",
    () => {

        if(

            typeof DeviceOrientationEvent !==
            "undefined"

            &&

            typeof DeviceOrientationEvent
            .requestPermission ===
            "function"

        ){

            DeviceOrientationEvent
            .requestPermission()
            .catch(() => {});

        }

    },
    {
        once:true
    }
);

</script>
